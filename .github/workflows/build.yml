name: Build LC Meter (Blue Pill / STM32F103C8)

on:
  push:
    paths:
      - '**.ino'
      - '**.cpp'
      - '**.h'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - '**.ino'
      - '**.cpp'
      - '**.h'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sketch:
          - lc_meter/lc_meter_lcd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cai dat arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Cai dat core STM32 (STMicroelectronics)
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
          arduino-cli core update-index
          arduino-cli core install STMicroelectronics:stm32

      - name: Cai thu vien can thiet
        run: |
          arduino-cli lib install "LiquidCrystal I2C"

      - name: Build sketch
        run: |
          arduino-cli compile \
            --fqbn STMicroelectronics:stm32:GenF1:pnum=BLUEPILL_F103C8 \
            "${{ matrix.sketch }}" \
            --warnings default

      - name: Upload build output (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ strategy.job-index }}
          path: |
            **/*.hex
            **/*.bin
          if-no-files-found: ignore
          
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ strategy.job-index }}
          path: |
            **/*.hex
            **/*.bin
          if-no-files-found: warn
